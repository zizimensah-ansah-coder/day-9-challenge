<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" , initial scale="1.0">
        <title>Task Management Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>TaskFlow</h1>
        <nav>
            <ul>
           <li><a href="#">Dashboard</a></li>
            <li><a href ="#">Tasks</a></li>
            <li><a href="#">Clear Page</a></li>
            </ul>
        </nav>
        <!--Dashboard  Summary Cards -->
        <div class="card">
            <h2>Total Cards</h2>
            <p id="totalCards">10</p>
        </div><br>
        <div class="card">
            <h2>Completed</h2>
            <p id="completed">4</p>
        </div><br>
        <div class="card">
            <h2>Pending</h2>
            <p id="pending">6</p>
        </div><br>
        
        <section>
            <!-- Task List will be displayed here-->
        <div id="taskList"></div>
        </section>
        
        <!-- Form for creating a task -->
            <section>
                <h3>Create New Task</h3>
                <form id="taskForm>
                    <label="taskId">Task ID</label>
                    <input type="text" id="taskId"><br><br>
                    <label="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle"><br><br>
                    <label ="status">Status</label>
                    <select id="taskStatus" name="taskStatus">
                        <option value="select status">Select Status</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                    </select>
                </form><br><br>
                
            </section>
            <!--Search Input and status filters-->
            <section>
                <div class="search-box">
                    <label for="searchInput">Search Tasks</label>
                    <input type="text" id="searchInput" name="searchInput" placeholder="Search Task By Title...">

                </div><br><br>
                <div class="filter-box">
                    <label for="statusFilter">Filter By Status</label>
                    <select id="statusFilter" statusFilter>
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </section><br><br>
            <p id="loadingMessage" class="message">Loading ..</p>
            <p id="successMessage"   class="message success"></p>
            <p id="emptyMessage"  class="message empty hidden"> </p>
            <p id="errorMessage" class="message error"></p>
            <script src="script.js"></script>
    </body>
</html>
